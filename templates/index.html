{% extends 'base.html' %}
{% block body %}
<div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 88vh; display: flex; align-items: center;">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="text-center text-white">
                    <h1 style="font-size: 3.5rem; font-weight: 700; margin-bottom: 20px;">Welcome to Auth App</h1>
                    <p style="font-size: 1.3rem; margin-bottom: 40px; opacity: 0.95;">Secure authentication and registration system</p>
                    <div class="d-flex gap-3 justify-content-center flex-wrap">
                        <a href="/register" class="btn" style="background-color: white; color: #667eea; padding: 12px 35px; font-weight: 600; border-radius: 8px; font-size: 1.1rem; transition: all 0.3s ease;" onmouseover="this.style.transform='translateY(-3px)'; this.style.boxShadow='0 8px 20px rgba(0,0,0,0.2)';" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='none';">Get Started</a>
                        <a href="/login" class="btn" style="background-color: transparent; color: white; padding: 12px 35px; font-weight: 600; border: 2px solid white; border-radius: 8px; font-size: 1.1rem; transition: all 0.3s ease;" onmouseover="this.style.backgroundColor='white'; this.style.color='#667eea'; this.style.transform='translateY(-3px)';" onmouseout="this.style.backgroundColor='transparent'; this.style.color='white'; this.style.transform='translateY(0)';">Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock body %}
